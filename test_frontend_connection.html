<!DOCTYPE html>
<html>
<head>
    <title>Frontend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>OptiAI Frontend Connection Test</h1>
    <div id="results"></div>
    <button onclick="runAllTests()">Run All Tests</button>
    
    <script>
        const resultsDiv = document.getElementById('results');
        
        function addResult(title, success, data = null) {
            const div = document.createElement('div');
            div.className = `test ${success ? 'success' : 'error'}`;
            div.innerHTML = `
                <h3>${title}</h3>
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
            resultsDiv.appendChild(div);
        }
        
        async function testBackendHealth() {
            try {
                const response = await fetch('http://127.0.0.1:5175/health');
                const data = await response.json();
                addResult('Backend Health Check', true, data);
                return true;
            } catch (error) {
                addResult('Backend Health Check', false, { error: error.message });
                return false;
            }
        }
        
        async function testMetricsAPI() {
            try {
                const response = await fetch('http://127.0.0.1:5175/api/metrics');
                const data = await response.json();
                addResult('Metrics API', true, data);
                return data;
            } catch (error) {
                addResult('Metrics API', false, { error: error.message });
                return null;
            }
        }
        
        async function testStartupAPI() {
            try {
                const response = await fetch('http://127.0.0.1:5175/api/startup');
                const data = await response.json();
                addResult('Startup API', true, data);
                return data;
            } catch (error) {
                addResult('Startup API', false, { error: error.message });
                return null;
            }
        }
        
        async function testCORS() {
            try {
                const response = await fetch('http://127.0.0.1:5175/api/metrics', {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': 'http://localhost:3002',
                        'Access-Control-Request-Method': 'GET',
                        'Access-Control-Request-Headers': 'Content-Type'
                    }
                });
                addResult('CORS Test', response.ok, { 
                    status: response.status, 
                    headers: Object.fromEntries(response.headers.entries())
                });
                return response.ok;
            } catch (error) {
                addResult('CORS Test', false, { error: error.message });
                return false;
            }
        }
        
        async function testFrontendPort() {
            try {
                const response = await fetch('http://localhost:3002');
                addResult('Frontend Port Test', response.ok, { 
                    status: response.status,
                    url: response.url
                });
                return response.ok;
            } catch (error) {
                addResult('Frontend Port Test', false, { error: error.message });
                return false;
            }
        }
        
        async function runAllTests() {
            resultsDiv.innerHTML = '';
            addResult('Test Started', true, { timestamp: new Date().toISOString() });
            
            const healthOk = await testBackendHealth();
            const metricsData = await testMetricsAPI();
            const startupData = await testStartupAPI();
            const corsOk = await testCORS();
            const frontendOk = await testFrontendPort();
            
            // Summary
            const summary = {
                backend_health: healthOk,
                metrics_api: !!metricsData,
                startup_api: !!startupData,
                cors: corsOk,
                frontend: frontendOk,
                metrics_values: metricsData ? {
                    cpu: Math.round(metricsData.cpu_percent || 0),
                    memory: Math.round(metricsData.memory_percent || 0),
                    disk: Math.round(metricsData.disk_percent || 0)
                } : null
            };
            
            addResult('Test Summary', true, summary);
        }
        
        // Auto-run tests on load
        runAllTests();
    </script>
</body>
</html>
