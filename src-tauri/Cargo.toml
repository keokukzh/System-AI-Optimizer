[package]
name = "optiai"
version = "1.0.0"
description = "AI-powered system optimization tool"
authors = ["OptiAI Team"]
license = "MIT"
repository = "https://github.com/optiai/optiai"
edition = "2021"

[[bin]]
name = "optiai"
path = "src/main.rs"

[lib]
name = "optiai"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["fs-all", "http-all", "os-all", "path-all", "process-exit", "process-relaunch", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sysinfo = "0.30"
walkdir = "2.4"
winreg = "0.52"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
lazy_static = "1.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
