version: '3.8'

services:
  # Frontend Testing Service
  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: frontend-test
    container_name: optiai-frontend-test
    environment:
      - NODE_ENV=test
      - VITE_BACKEND_URL=http://backend-test:5174
    volumes:
      - ./src:/app/src:ro
      - ./tests/frontend:/app/tests:ro
    command: ["npm", "run", "test"]
    networks:
      - optiai-test

  # Backend Testing Service
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: backend-test
    container_name: optiai-backend-test
    environment:
      - PYTHONPATH=/app
      - BACKEND_URL=http://localhost:5174
      - LLM_SERVER_URL=http://localhost:11435
    volumes:
      - ./backend:/app/backend:ro
      - ./tests:/app/tests:ro
      - ./schemas:/app/schemas:ro
    ports:
      - "5174:5174"
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    networks:
      - optiai-test

  # Tauri Testing Service
  tauri-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: tauri-test
    container_name: optiai-tauri-test
    environment:
      - RUST_LOG=debug
      - CARGO_TARGET_DIR=/app/target
    volumes:
      - ./src-tauri:/app/src-tauri:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./Cargo.lock:/app/Cargo.lock:ro
    command: ["cargo", "check", "--release"]
    networks:
      - optiai-test

  # Integration Testing Service
  integration-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: integration-test
    container_name: optiai-integration-test
    environment:
      - NODE_ENV=test
      - BACKEND_URL=http://backend-test:5174
      - FRONTEND_URL=http://frontend-test:3001
      - DISPLAY=:99
    volumes:
      - ./tests/e2e:/app/tests/e2e:ro
      - ./scripts:/app/scripts:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "3001:3001"
      - "5174:5174"
    depends_on:
      - frontend-test
      - backend-test
    command: ["python3", "-m", "pytest", "tests/e2e/", "-v", "--tb=short"]
    networks:
      - optiai-test

  # Mock LLM Server for Testing
  mock-llm-server:
    image: nginx:alpine
    container_name: optiai-mock-llm
    ports:
      - "11435:80"
    volumes:
      - ./tests/mock-llm:/usr/share/nginx/html:ro
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - optiai-test

  # Test Database (if needed)
  test-db:
    image: postgres:15-alpine
    container_name: optiai-test-db
    environment:
      - POSTGRES_DB=optiai_test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    ports:
      - "5432:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    networks:
      - optiai-test

  # Redis for Caching Tests
  test-redis:
    image: redis:7-alpine
    container_name: optiai-test-redis
    ports:
      - "6379:6379"
    volumes:
      - test-redis-data:/data
    networks:
      - optiai-test

  # Selenium Grid for Browser Testing
  selenium-hub:
    image: selenium/hub:4.15.0
    container_name: optiai-selenium-hub
    ports:
      - "4444:4444"
    networks:
      - optiai-test

  selenium-chrome:
    image: selenium/node-chrome:4.15.0
    container_name: optiai-selenium-chrome
    environment:
      - HUB_HOST=selenium-hub
      - HUB_PORT=4444
    depends_on:
      - selenium-hub
    networks:
      - optiai-test

  selenium-firefox:
    image: selenium/node-firefox:4.15.0
    container_name: optiai-selenium-firefox
    environment:
      - HUB_HOST=selenium-hub
      - HUB_PORT=4444
    depends_on:
      - selenium-hub
    networks:
      - optiai-test

  # Playwright Testing Service
  playwright-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: integration-test
    container_name: optiai-playwright-test
    environment:
      - NODE_ENV=test
      - BACKEND_URL=http://backend-test:5174
      - FRONTEND_URL=http://frontend-test:3001
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - ./tests/e2e:/app/tests/e2e:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - frontend-test
      - backend-test
    command: ["npx", "playwright", "test", "--reporter=html"]
    networks:
      - optiai-test

  # Performance Testing Service
  performance-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: integration-test
    container_name: optiai-performance-test
    environment:
      - NODE_ENV=test
      - BACKEND_URL=http://backend-test:5174
      - FRONTEND_URL=http://frontend-test:3001
    volumes:
      - ./tests/performance:/app/tests/performance:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - frontend-test
      - backend-test
    command: ["python3", "-m", "pytest", "tests/performance/", "-v", "--tb=short"]
    networks:
      - optiai-test

  # Security Testing Service
  security-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: integration-test
    container_name: optiai-security-test
    environment:
      - NODE_ENV=test
      - BACKEND_URL=http://backend-test:5174
    volumes:
      - ./tests/security:/app/tests/security:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - backend-test
    command: ["python3", "-m", "pytest", "tests/security/", "-v", "--tb=short"]
    networks:
      - optiai-test

  # Load Testing Service
  load-test:
    image: grafana/k6:latest
    container_name: optiai-load-test
    environment:
      - K6_VUS=10
      - K6_DURATION=30s
    volumes:
      - ./tests/load:/scripts:ro
    depends_on:
      - backend-test
    command: ["k6", "run", "/scripts/load-test.js"]
    networks:
      - optiai-test

  # Test Results Aggregator
  test-results:
    image: nginx:alpine
    container_name: optiai-test-results
    ports:
      - "8080:80"
    volumes:
      - ./test-results:/usr/share/nginx/html:ro
    networks:
      - optiai-test

networks:
  optiai-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  test-db-data:
    driver: local
  test-redis-data:
    driver: local
